<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F49D6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Formkurve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app, sticky date bar on top, fixed tab bar at the bottom; big condensed "scoreboard" numbers carry the identity */
:root{
  --bg:#EBEEF1; --surface:#FFFFFF; --ink:#14181D; --muted:#5A6370; --line:#D6DBE1;
  --accent:#1F49D6; --accent-ink:#FFFFFF; --accent-soft:#E3E9FC;
  --good:#1D8048; --good-soft:#DDF1E4; --warn:#A86A12; --track:#DCE1E7;
  --muscle:#C3CBD4; --p25:#C8352B; --p20:#1F49D6; --p15:#D9A21B; --p10:#2E8B57; --p5:#E9ECEF; --p2:#7B8794; --p1:#B8C0C9;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1115; --surface:#171B21; --ink:#E7EAEE; --muted:#97A0AC; --line:#2A3038;
  --accent:#7290FF; --accent-ink:#0A0D14; --accent-soft:#1C2540;
  --good:#4CC38A; --good-soft:#15291F; --warn:#E3B04B; --track:#252B33;
  --p5:#3A414B; --muscle:#3A424D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1115; --surface:#171B21; --ink:#E7EAEE; --muted:#97A0AC; --line:#2A3038;
  --accent:#7290FF; --accent-ink:#0A0D14; --accent-soft:#1C2540;
  --good:#4CC38A; --good-soft:#15291F; --warn:#E3B04B; --track:#252B33;
  --p5:#3A414B; --muscle:#3A424D; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-block:0 170px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px 10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin-right:auto;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:none;color:var(--muted);margin-top:3px}
.datebar{display:flex;align-items:center;gap:2px}
.datebar button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer}
.datebar span{min-width:96px;text-align:center;font-weight:600;font-size:14px}
.datebar span.today{color:var(--accent)}
h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h3{margin:0;font-size:16px;font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.big{font-family:var(--display);font-weight:700;font-size:52px;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big small{font-size:22px;font-weight:500;color:var(--muted);letter-spacing:0}
.unit{font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.scores>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .3s}
.bar.ok i{background:var(--good)}
.bar.over i{background:var(--warn)}
.sub{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.btn{appearance:none;border:0;border-radius:11px;padding:11px 16px;font:600 15px var(--body);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:500 16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.checks{display:flex;flex-direction:column}
.check{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--ink);font:500 15px var(--body);text-align:left;width:100%}
.check:first-child{border-top:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;font-weight:700}
.check[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:var(--surface)}
.check.auto{cursor:default}
.check .sub{margin-left:auto}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--track);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;border-radius:9px;padding:9px;font:600 14px var(--body);background:transparent;color:var(--muted);cursor:pointer}
.seg button small{font-weight:500;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ex{display:flex;flex-direction:column;gap:10px}
.ex header{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.ex header h3{min-width:0}
.scheme{font-family:var(--display);font-weight:600;font-size:18px;white-space:nowrap;color:var(--accent)}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 7px;white-space:nowrap}
.swapbox{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:10px;background:var(--bg)}
.hint{margin:0;font-size:13px;color:var(--muted)}
.hint b{color:var(--good);font-weight:600}
.set{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center}
.set .no{font-family:var(--display);font-weight:600;font-size:20px;color:var(--muted);text-align:center}
.set input{text-align:center;font-variant-numeric:tabular-nums;padding:9px 6px}
.set.single{grid-template-columns:26px 1fr 46px}
.tick{height:42px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--muted);font-size:18px;font-weight:700;cursor:pointer}
.set.done .tick{background:var(--good);border-color:var(--good);color:var(--surface)}
.set.done input{border-color:var(--good)}
.colhead{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.colhead.single{grid-template-columns:26px 1fr 46px}
.plates{display:flex;align-items:center;gap:3px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.plate{display:inline-grid;place-items:center;border-radius:3px;color:#fff;font:700 10px var(--body);width:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:7px 12px;font:500 13px var(--body);cursor:pointer}
.chip small{color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.figimg,.figmus{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg);border-radius:12px;padding:10px 8px 8px;min-width:0}
.figimg img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;max-width:100%}
.illu{width:100%;max-width:170px;height:auto}
.illu .fa{fill:var(--track)}
.mmap{width:100%;max-width:170px;height:auto}
.mmap text{fill:var(--muted);font:500 10px var(--body)}
.cap{font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.cap b{color:var(--ink);font-weight:600}
.photo{margin-top:auto}
.rest{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:540px;margin:0 auto}
.rest.over{background:var(--good)}
.rest .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.rest-l{font-size:12px;font-weight:600;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest-t{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.rest-b{border:1px solid currentColor;background:transparent;color:inherit;border-radius:10px;padding:9px 12px;font:600 14px var(--body);cursor:pointer}
.vol{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.vrow .num{text-align:right;font-weight:600}
.vbar{position:relative;height:10px;border-radius:99px;background:var(--track)}
.vbar i{display:block;height:100%;border-radius:inherit;background:var(--warn)}
.vbar.mid i{background:var(--accent)}
.vbar.ok i{background:var(--good)}
.vbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.know p{margin:0}
.know ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:10px}
.know li{line-height:1.45}
.src{font-size:11px;color:var(--muted);white-space:nowrap}
.supp{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.supp:first-of-type{border-top:0;padding-top:0}
.supp .btn{align-self:flex-start}
.warnbox{border-color:var(--warn)}
.warnbox h2{color:var(--warn)}
.rir{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:2px 0 4px 34px;font-size:12px;color:var(--muted)}
.rirb{display:flex;gap:4px}
.rirb button{min-width:38px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 13px var(--body);cursor:pointer}
.rirb button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.advice{margin:0;font-size:13px;font-weight:600;color:var(--ink);background:var(--bg);border-radius:10px;padding:9px 12px}
.advice.up{color:var(--good);background:var(--good-soft)}
.advice.down{color:var(--warn)}
@keyframes adj{0%{background:var(--accent-soft);border-color:var(--accent)}100%{}}
.set input.adj{animation:adj 1.6s ease-out}
.ss{margin:0;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;width:34px;height:34px;border-radius:8px;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.tile .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-top:6px}
.good{color:var(--good)} .warn{color:var(--warn)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:500 10px var(--body)}
details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font:600 11px var(--body);cursor:pointer;border-radius:10px}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:7;max-width:calc(100% - 32px);text-align:center}
.status{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.status.err{color:var(--warn)}
@media (max-width:380px){.big{font-size:44px}.datebar span{min-width:84px;font-size:13px}.tiles .v{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">Formkurve<small id="status">Lädt …</small></div>
    <div class="datebar">
      <button id="prev" aria-label="Vorheriger Tag">‹</button>
      <span id="datelabel"></span>
      <button id="next" aria-label="Nächster Tag">›</button>
    </div>
  </header>
  <main id="view" class="stack"></main>
</div>

<nav class="tabs" aria-label="Bereiche">
  <button data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>Heute</button>
  <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M3 12h18M6 8v8M9 6v12M15 6v12M18 8v8"/></svg>Training</button>
  <button data-tab="food"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 21V3c-2 1-3 4-3 8h3"/></svg>Essen</button>
  <button data-tab="prog"><svg viewBox="0 0 24 24"><path d="M4 19h16M5 15l4-4 3 3 7-7"/></svg>Fortschritt</button>
  <button data-tab="know"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7M8 11h5"/></svg>Wissen</button>
</nav>
<div id="rest" class="rest" hidden role="timer" aria-live="polite"><div class="grow"><span id="rest-label" class="rest-l"></span><span id="rest-time" class="rest-t">0:00</span></div><button id="rest-add" class="rest-b" aria-label="30 Sekunden mehr Pause">+30 s</button><button id="rest-stop" class="rest-b" aria-label="Pause beenden">Weiter</button></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="photo-in" accept="image/*" hidden>
<input type="file" id="import-in" accept="application/json,.json" hidden>

<script>
// ---------- Plan ----------
// Bereiche laut Studioseite MC Shape Köngen: Freie Gewichte, Life Fitness Kraft-Zirkel / Gerätetraining, X-Cross, Dr. Wolff, Functional Area
const AREA={fh:"Freie Gewichte",lf:"Life Fitness Geräte",cab:"Kabelzug / X-Cross",wolff:"Dr. Wolff",fn:"Functional Area"};
const PAT={knee:"Beine (Kniebeuge-Muster)",hinge:"Rückseite & Po",hpush:"Brust drücken",vpull:"Rücken – von oben ziehen",hpull:"Rücken – rudern",vpush:"Schultern drücken",uni:"Beine einzeln / Oberschenkel",shoulder:"Seitliche Schulter",core:"Rumpf",tri:"Trizeps (Armstrecker)",bi:"Bizeps (Armbeuger)",rear:"Hintere Schulter & oberer Rücken",fly:"Brust isoliert"};
const LIB={
  squat:{n:"Kniebeuge (Langhantel)",area:"fh",pat:"knee",inc:2.5,start:20,bar:true},
  goblet:{n:"Goblet Squat auf eine Bank (Kurzhantel)",area:"fn",pat:"knee",inc:2,start:12},
  legpress:{n:"Beinpresse",area:"lf",pat:"knee",inc:5,start:60},
  bench:{n:"Bankdrücken (Langhantel)",area:"fh",pat:"hpush",inc:2.5,start:20,bar:true},
  chestpress:{n:"Brustpresse",area:"lf",pat:"hpush",inc:2.5,start:25},
  incline:{n:"Schrägbankdrücken (Kurzhanteln, kg je Hantel)",area:"fh",pat:"hpush",inc:2,start:12},
  cablepress:{n:"Brustpresse am Kabel, stehend",area:"cab",pat:"hpush",inc:2.5,start:10},
  latpull:{n:"Latzug",area:"lf",pat:"vpull",inc:2.5,start:30},
  cablepull:{n:"Latziehen am Kabelturm, kniend",area:"cab",pat:"vpull",inc:2.5,start:20},
  row:{n:"Rudern am Kabel",area:"cab",pat:"hpull",inc:2.5,start:30},
  rowmachine:{n:"Rudermaschine (sitzend)",area:"lf",pat:"hpull",inc:2.5,start:30},
  dbrow:{n:"Kurzhantel-Rudern einarmig (kg je Hantel)",area:"fh",pat:"hpull",inc:2,start:14},
  rdl:{n:"Rumänisches Kreuzheben (Langhantel)",area:"fh",pat:"hinge",inc:2.5,start:30,bar:true},
  legcurl:{n:"Beinbeuger (sitzend)",area:"lf",pat:"hinge",inc:2.5,start:25},
  backext:{n:"Rückenstrecker",area:"wolff",pat:"hinge",inc:2.5,start:20},
  kbswing:{n:"Kettlebell-Swing",area:"fn",pat:"hinge",inc:4,start:12},
  ohp:{n:"Schulterdrücken (Kurzhanteln, kg je Hantel)",area:"fh",pat:"vpush",inc:1,start:8},
  shoulderpress:{n:"Schulterpresse",area:"lf",pat:"vpush",inc:2.5,start:20},
  lunge:{n:"Ausfallschritte (Kurzhanteln, Wdh je Bein)",area:"fh",pat:"uni",inc:2,start:6},
  legext:{n:"Beinstrecker",area:"lf",pat:"uni",inc:2.5,start:25},
  stepup:{n:"Step-ups auf Box (Kurzhanteln, Wdh je Bein)",area:"fn",pat:"uni",inc:2,start:6},
  lateral:{n:"Seitheben (Kurzhanteln)",area:"fh",pat:"shoulder",inc:1,start:4},
  cablelateral:{n:"Seitheben am Kabel, einarmig",area:"cab",pat:"shoulder",inc:1.25,start:2.5},
  plank:{n:"Unterarmstütz",area:"fn",pat:"core",time:true,lo:30,hi:45},
  crunch:{n:"Kabel-Crunch",area:"cab",pat:"core",inc:2.5,start:20},
  abmachine:{n:"Bauchmaschine",area:"lf",pat:"core",inc:2.5,start:20},
  wolffrot:{n:"Rumpfrotation (Wdh je Seite)",area:"wolff",pat:"core",inc:2.5,start:15},
  pallof:{n:"Pallof Press am Kabel (Wdh je Seite)",area:"cab",pat:"core",inc:1.25,start:7.5},
  triceps:{n:"Trizepsdrücken am Kabel (Seil)",area:"cab",pat:"tri",inc:2.5,start:15},
  ohtriceps:{n:"Überkopf-Trizepsstrecken am Kabel",area:"cab",pat:"tri",inc:2.5,start:10},
  tricepsmachine:{n:"Trizepsmaschine / Dip-Maschine",area:"lf",pat:"tri",inc:2.5,start:20},
  dbcurl:{n:"Bizepscurls (Kurzhanteln, kg je Hantel)",area:"fh",pat:"bi",inc:1,start:8},
  cablecurl:{n:"Bizepscurls am Kabel",area:"cab",pat:"bi",inc:2.5,start:15},
  bicepsmachine:{n:"Bizepsmaschine",area:"lf",pat:"bi",inc:2.5,start:15},
  facepull:{n:"Face Pulls am Kabel (Seil)",area:"cab",pat:"rear",inc:2.5,start:10},
  reversefly:{n:"Reverse Butterfly (Maschine)",area:"lf",pat:"rear",inc:2.5,start:15},
  dbreardelt:{n:"Vorgebeugtes Seitheben (Kurzhanteln)",area:"fh",pat:"rear",inc:1,start:4},
  cablefly:{n:"Butterfly am Kabel (Cable Fly)",area:"cab",pat:"fly",inc:2.5,start:7.5},

function dayObj(d,create){

// Fotos liegen in IndexedDB, angezeigt über Objekt-URLs
const PHOTO_URLS={};
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("formkurve",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbDo(mode,fn){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction("photos",mode);const st=tx.objectStore("photos");const out=fn(st);tx.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);tx.onerror=()=>rej(tx.error)})}
async function loadPhotos(){
  try{const ids=Object.values(settings().photos||{});
    for(const id of ids){if(PHOTO_URLS[id])continue;const b=await idbDo("readonly",st=>st.get(id));if(b)PHOTO_URLS[id]=URL.createObjectURL(b)}
  }catch(e){}
}
const ASSETS_LOCAL={
  async upload(blob){const id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    await idbDo("readwrite",st=>st.put(blob,id));PHOTO_URLS[id]=URL.createObjectURL(blob);return{id}},
  async delete(id){await idbDo("readwrite",st=>st.delete(id));if(PHOTO_URLS[id]){URL.revokeObjectURL(PHOTO_URLS[id]);delete PHOTO_URLS[id]}}
};
async function connect(){
  ASSETS=("indexedDB" in window)?ASSETS_LOCAL:null;
  setStatus("saved");
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  await loadPhotos();render();
}

  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);

// ----- Training -----
function lastFor(id){const ss=allSessions();for(let i=ss.length-1;i>=0;i--){const s=ss[i].ex&&ss[i].ex[id];if(s&&s.length)return{date:ss[i].date,sets:s}}return null}
function suggest(ex){
  const l=lastFor(ex.id);
  if(!l)return{kg:ex.time?null:ex.start,why:ex.time?"Erstes Mal: so lange, wie du sauber halten kannst.":"Erstes Mal: leicht starten. Nach jedem Satz passt die App das Gewicht an."};
  if(ex.time){const best=Math.max(...l.sets.map(s=>s[1]||0));const all=l.sets.every(s=>(s[1]||0)>=ex.hi);
    return{kg:null,last:l,target:all?best+5:best,up:all,why:all?"Alle Sätze ≥ "+ex.hi+" s → 5 s länger":"Ziel: "+ex.hi+" s in allen Sätzen"}}
  const kg=Math.max(...l.sets.map(s=>s[0]||0));
  const withR=l.sets.filter(x=>x[2]!=null&&x[0]&&x[1]);
  if(withR.length){
    const best=Math.max(...withR.map(x=>e1rm(x[0],x[1],x[2])));
    const nk=clampKg(ex,kg,roundKg(ex,kgFor(ex,best,0))),d=Math.round((nk-kg)*100)/100;
    return{kg:nk,last:l,up:d>0,why:d>0?"Letztes Mal war noch Reserve übrig → +"+fkg(d)+" kg":d<0?"Letztes Mal zu schwer → "+fkg(nk)+" kg ("+fkg(d)+" kg)":"Gewicht passt, Ziel "+ex.hi+" Wdh in jedem Satz"};
  }
  const all=l.sets.length>=ex.sets&&l.sets.every(s=>(s[1]||0)>=ex.hi);
  return all?{kg:kg+ex.inc,last:l,up:true,why:"Alle Sätze mit "+ex.hi+" Wdh → +"+fkg(ex.inc)+" kg"}
            :{kg,last:l,why:"Gleiches Gewicht, Ziel "+ex.hi+" Wdh in jedem Satz"};
}
// ----- Automatische Gewichtssteuerung (Reserve/RIR-basiert) -----
const targetRIR=()=>learning()?2.5:1.5;
const e1rm=(kg,reps,rir)=>kg*(1+(reps+rir)/30);                 // geschätztes 1-Wdh-Maximum (Epley)
const kgFor=(ex,e1,idx)=>e1/(1+((ex.lo+ex.hi)/2+targetRIR()+(idx>0?1:0))/30); // Ziel: Mitte der Wdh-Spanne, spätere Sätze mit Ermüdung
function roundKg(ex,x){const st=ex.inc||2.5;return Math.max(ex.bar?20:st,Math.round(Math.round(x/st)*st*100)/100)}
function clampKg(ex,kg,nk){const st=ex.inc||2.5,maxD=Math.max(st,Math.floor(kg*0.15/st)*st);return Math.round(Math.min(kg+maxD,Math.max(kg-maxD,nk))*100)/100}
function setAdvice(ex,st){
  const kg=num(st.kg),reps=num(st.reps);if(ex.time||kg==null||reps==null)return null;
  let rir=st.rir;
  if(rir==null){if(reps<ex.lo)rir=0;else if(reps>ex.hi+2)rir=targetRIR();else return{kg,d:0,why:"Wie viele Wdh wären noch gegangen? Dann passe ich das Gewicht genau an."}}
  const nk=clampKg(ex,kg,roundKg(ex,kgFor(ex,e1rm(kg,reps,rir),1))),d=Math.round((nk-kg)*100)/100;
  const res=rir>=4?"4+ Wdh":rir===1?"1 Wdh":rir+" Wdh";
  return{kg:nk,d,why:d>0?`Nächster Satz: ${fkg(nk)} kg (+${fkg(d)}) – ${reps} Wdh mit ${res} Reserve war zu leicht`:
    d<0?`Nächster Satz: ${fkg(nk)} kg (${fkg(d)}) – damit du ${ex.lo}–${ex.hi} Wdh sauber schaffst`:`Nächster Satz: ${fkg(kg)} kg – passt genau`};
}
function applyAdvice(art,ex,i){
  const sets=drafts[S.trainPlan].sets[ex.id],a=setAdvice(ex,sets[i]);const el=art.querySelector("[data-advice]");
  if(!a){if(el)el.hidden=true;return null}
  if(a.d!==0)for(let j=i+1;j<sets.length;j++){if(sets[j].done)continue;sets[j].kg=fkg(a.kg);const inp=art.querySelector(`.set[data-i="${j}"] [data-f="kg"]`);if(inp){inp.value=sets[j].kg;inp.classList.remove("adj");void inp.offsetWidth;inp.classList.add("adj")}}
  saveDrafts();
  const next=sets.findIndex((x,j)=>j>i&&!x.done);
  if(el){el.hidden=false;el.className="advice"+(a.d>0?" up":a.d<0?" down":"");el.textContent=next<0?a.why.replace("Nächster Satz","Nächstes Mal eher"):a.why}
  const pl=art.querySelector("[data-plates]");if(pl&&next>=0)pl.innerHTML=platesHtml(sets[next].kg);
  return a;
}
function draftFor(p){
  if(!drafts[p])drafts[p]={sets:{}};let ch=false;
  resolve(p).forEach(ex=>{if(!drafts[p].sets[ex.id]){const s=suggest(ex);ch=true;
    drafts[p].sets[ex.id]=Array.from({length:ex.sets},()=>({kg:ex.time?"":(s.kg!=null?fkg(s.kg):""),reps:"",done:false}))}});
  if(ch)saveDrafts();
  return drafts[p];
}
function platesHtml(kg){
  kg=num(kg);if(kg==null||kg<20)return"";
  let side=(kg-20)/2;const out=[];[[25,"p25",40],[20,"p20",36],[15,"p15",32],[10,"p10",28],[5,"p5",22],[2.5,"p2",18],[1.25,"p1",14]].forEach(([w,c,h])=>{while(side>=w-1e-9){out.push([w,c,h]);side-=w}});
  if(side>0.01)return`<span>Nicht mit Scheiben darstellbar</span>`;
  return`<span>Pro Seite:</span>${out.length?out.map(([w,c,h])=>`<span class="plate" style="height:${h}px;background:var(--${c});${c==="p5"?"color:var(--ink)":""}" title="${fkg(w)} kg">${w>=10?w:""}</span>`).join("")+` <span>${out.map(o=>fkg(o[0])).join(" + ")} kg</span>`:"<span>nur die Stange (20 kg)</span>"}`;
}
function segHtml(p){return`<div class="seg" role="group" aria-label="Trainingsart">${["A","B","C","X"].map(k=>`<button data-act="plan" data-v="${k}" aria-pressed="${k===p}">${k==="X"?"Ausdauer":PLAN[k].short}</button>`).join("")}</div>`}
function cardioWeek(d){const [mon,sun]=weekRange(d);return allSessions().filter(s=>s.cardio&&s.date>=mon&&s.date<=sun).reduce((a,s)=>a+(s.cardio.min||0),0)}

        sub=[fmt(c.min)+" min",c.km?fmt(c.km,1)+" km":"",c.hr?"Ø "+fmt(c.hr)+" Puls":"",c.kcal?fmt(c.kcal)+" kcal":""].filter(Boolean).join(" · ")}
      else{const n=Object.values(s.ex||{}).reduce((a,x)=>a+x.length,0);const vol=Object.values(s.ex||{}).flat().reduce((a,x)=>a+(x[0]||0)*(x[1]||0),0);

function hrZone(){const age=settings().age;if(!age)return`<p class="hint">Locker heißt: Du kannst nebenbei noch in ganzen Sätzen sprechen.</p>`;

  if(p==="X")return segHtml(p)+viewCardio()+histHtml();

  ${resolve(p).map(ex=>{const s=suggest(ex);const sets=d.sets[ex.id]||[];
    const used=new Set(resolve(p).map(x=>x.id));
    const alts=Object.keys(LIB).filter(id=>LIB[id].pat===ex.pat&&!used.has(id));

    return`<article class="card ex" data-ex="${ex.id}">

async function shrink(file){
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,1200/Math.max(bmp.width,bmp.height));

    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),"image/jpeg",.82));
  }catch(e){return file}
}

const TEMPOS=[[0.5,"Langsam","0,5 %"],[0.7,"Empfohlen","0,7 %"],[1,"Schnell","1 %"]];
const tempo=()=>settings().tempo||0.7;
const kcalFloor=()=>settings().sex==="w"?1200:1500;
// Echter Verbrauch aus Daten: Ø Kalorien − Gewichtstrend × 7.700 kcal/kg (letzte 21 Tage)
function adaptive(){
  const end=today(),start=addDays(end,-20);
  const intake=[];for(let d=start;d<=end;d=addDays(d,1)){const k=totals(d).kcal;if(k>=800)intake.push(k)}
  const ws=weights().filter(w=>w[0]>=start&&w[0]<=end);
  const t0=new Date(start+"T12:00");const x=ws.map(w=>(new Date(w[0]+"T12:00")-t0)/864e5),y=ws.map(w=>w[1]);
  const span=x.length?x[x.length-1]-x[0]:0;
  if(intake.length<10||ws.length<8||span<12)return{need:{food:Math.max(0,10-intake.length),w:Math.max(0,8-ws.length)}};
  const mx=x.reduce((a,b)=>a+b,0)/x.length,my=y.reduce((a,b)=>a+b,0)/y.length;
  let nu=0,de=0;x.forEach((xi,i)=>{nu+=(xi-mx)*(y[i]-my);de+=(xi-mx)**2});const slope=de?nu/de:0;
  const avgIn=intake.reduce((a,b)=>a+b,0)/intake.length;const tdee=avgIn-slope*7700;
  const w=avgTo(weights(),end)||my;
  const target=Math.max(kcalFloor(),Math.round((tdee-deficitFor(w))/50)*50);
  return{tdee:Math.round(tdee/10)*10,perWeek:slope*7,avgIn:Math.round(avgIn),target};
}

function chart(ws){
  const end=today(),start=addDays(end,-89);const pts=ws.filter(w=>w[0]>=start);
  if(pts.length<2)return`<p class="sub">Ab zwei Gewichtseinträgen siehst du hier deine Kurve mit 7-Tage-Schnitt.</p>`;
  const W=340,H=170,L=34,R=10,T=10,B=22;
  const dayIdx=d=>Math.round((new Date(d+"T12:00")-new Date(pts[0][0]+"T12:00"))/864e5);
  const span=Math.max(1,dayIdx(pts[pts.length-1][0]));
  const avg=pts.map(p=>[p[0],avgTo(ws,p[0])]);
  const vals=pts.map(p=>p[1]).concat(avg.map(a=>a[1]));let lo=Math.min(...vals),hi=Math.max(...vals);
  lo=Math.floor(lo-0.5);hi=Math.ceil(hi+0.5);
  const x=d=>L+dayIdx(d)/span*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const step=Math.max(1,Math.round((hi-lo)/3));const ticks=[];for(let v=lo;v<=hi;v+=step)ticks.push(v);
  const path=avg.map((a,i)=>(i?"L":"M")+x(a[0]).toFixed(1)+" "+y(a[1]).toFixed(1)).join(" ");
  const la=avg[avg.length-1];
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverlauf">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join("")}
    <path d="${path} L${x(la[0]).toFixed(1)} ${H-B} L${L} ${H-B} Z" fill="var(--accent-soft)" stroke="none" opacity=".7"/>
    ${pts.map(p=>`<circle cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="2.2" fill="var(--muted)" opacity=".55"/>`).join("")}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(la[0])}" cy="${y(la[1])}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${L}" y="${H-6}">${dlabel(pts[0][0],{day:"numeric",month:"short"})}</text>
    <text x="${W-R}" y="${H-6}" text-anchor="end">${dlabel(pts[pts.length-1][0],{day:"numeric",month:"short"})}</text>
  </svg>`;
}

  ${volumeCard()}
  <section class="card"><h2>Kraft</h2>
    ${strength.length?`<div class="list">${strength.map(x=>`<div class="item"><div class="grow">${esc(x.e.n.replace(/ \(.*\)/,""))}<div class="sub">${x.n} Einheiten</div></div><span class="num">${x.e.time?x.first+" → "+x.last+" s":fkg(x.first)+" → <b>"+fkg(x.last)+" kg</b>"}</span></div>`).join("")}</div>`
      :`<p class="sub">Nach deinen ersten Einheiten siehst du hier, wie sich dein Arbeitsgewicht pro Übung entwickelt.</p>`}
  </section>
  ${adaptiveCard()}
  <section class="card stack"><h2>Ziele</h2>
    <div><span class="sub">Abnehm-Tempo pro Woche (vom Körpergewicht)</span>
    <div class="seg" role="group" aria-label="Abnehm-Tempo" style="margin-top:6px">${TEMPOS.map(([v,l,p])=>`<button data-act="tempo" data-v="${v}" aria-pressed="${v===tempo()}">${l}<br><small>${p}</small></button>`).join("")}</div>
    <span class="sub">0,7 % ist der beste Kompromiss. Das Defizit ist auf höchstens 1.000 kcal pro Tag begrenzt (≈ 1 kg pro Woche) – mehr nur mit ärztlicher Begleitung.</span></div>
    <div class="grid2">
      <label class="f" for="s-kcal">Kalorien pro Tag<input id="s-kcal" inputmode="numeric" value="${s.kcal||""}" placeholder="2200"></label>
      <label class="f" for="s-p">Protein pro Tag (g)<input id="s-p" inputmode="numeric" value="${s.protein||""}" placeholder="160"></label>
      <label class="f" for="s-start">Startgewicht (kg)<input id="s-start" inputmode="decimal" value="${s.startW?fmt(s.startW,1):""}"></label>
      <label class="f" for="s-target">Zielgewicht (kg)<input id="s-target" inputmode="decimal" value="${s.targetW?fmt(s.targetW,1):""}"></label>
    </div>
    <button class="btn" data-act="save-settings">Ziele speichern</button>
    <details ${s.kcal?"":"open"}><summary>Ziele ausrechnen lassen</summary>
      <div class="stack" style="margin-top:12px">
        <div class="grid2">
          <label class="f" for="e-sex">Geschlecht<select id="e-sex"><option value="m"${est.sex==="m"?" selected":""}>Mann</option><option value="w"${est.sex==="w"?" selected":""}>Frau</option></select></label>
          <label class="f" for="e-age">Alter<input id="e-age" inputmode="numeric" value="${esc(est.age)}"></label>
          <label class="f" for="e-h">Größe (cm)<input id="e-h" inputmode="numeric" value="${esc(est.h)}"></label>
          <label class="f" for="e-w">Gewicht (kg)<input id="e-w" inputmode="decimal" value="${esc(est.w)}"></label>
        </div>
        <label class="f" for="e-act">Alltag<select id="e-act">
          <option value="1.375"${est.act==="1.375"?" selected":""}>Bürojob, 3× Training</option>
          <option value="1.55"${est.act==="1.55"?" selected":""}>Teils auf den Beinen, 3× Training</option>
          <option value="1.725"${est.act==="1.725"?" selected":""}>Körperlich aktiv, 3× Training</option></select></label>
        <button class="btn ghost" data-act="estimate">Ausrechnen</button>
        ${S.estRes?`<p class="note">Erhaltungsbedarf ca. <b>${fmt(S.estRes.tdee)} kcal</b>. Für ${fmt(tempo(),1)} % pro Woche: <b>${fmt(S.estRes.kcal)} kcal</b> (rund ${fmt(S.estRes.def)} kcal darunter, höchstens 1.000, nie unter dem Grundumsatz) und <b>${fmt(S.estRes.p)} g Protein</b> (2 g je kg, bei hohem Gewicht bezogen auf ein gesundes Referenzgewicht). Nach 2–3 Wochen rechnet der Wochen-Check mit deinen echten Daten nach.</p><button class="btn" data-act="apply-est">Als Ziele übernehmen</button>`:""}
      </div>
    </details>
  </section>
  <section class="card stack"><h2>Datensicherung</h2>
    <p class="sub">Alle Daten liegen nur auf diesem Handy. Sichere sie ab und zu, z. B. in deine Dateien oder per Mail an dich selbst. Fotos sind in der Sicherung nicht enthalten.</p>
    <div class="row"><button class="btn ghost" data-act="export">Sicherung erstellen</button><button class="btn ghost" data-act="import">Sicherung einspielen</button></div>
  </section>`;
}


// ----- Wissen -----
function viewKnow(){
  const cr=!!settings().creatine;
  const li=(t,d,src)=>`<li><b>${t}</b> ${d}${src?` <span class="src">${src}</span>`:""}</li>`;
  return`
  <section class="card stack know">
    <h2>Dein Weg: Rekomposition</h2>
    <p>Als Einsteiger kannst du gleichzeitig Fett abbauen und Muskeln aufbauen. Das klappt, wenn drei Dinge zusammenkommen: schweres Training mit stetiger Steigerung, viel Protein und ein moderates Kaloriendefizit. Die App ist genau darauf eingestellt.</p>
    <p class="sub">Erwartung: Die Waage sinkt langsamer, als du Fett verlierst, weil gleichzeitig Muskeln dazukommen. Bauchumfang, Kraftwerte und Spiegel zeigen den Fortschritt besser.</p>
  </section>
  <section class="card stack know">
    <h2>Training</h2>
    <ul>
      ${li("Ganzkörper, alle 2 Tage.","Tag A und B im Wechsel, also 3–4 Einheiten pro Woche. Jeder Muskel wird so fast 2× pro Woche trainiert. Das bringt mehr Wachstum als 1× pro Woche.","Schoenfeld et al. 2016")}
      ${li("Schwerpunkt Oberkörper.","Für Brust, Schultern, Arme und die V-Form bekommt der Oberkörper mehr Sätze. Seitheben und Face Pulls machen die Schultern breiter. Die Beine trainierst du mit weniger Sätzen weiter, für Kraft und Kalorienverbrauch.","")}
      ${li("Viel Volumen, aber dosiert.","Für deine Schwerpunkte kommst du so auf etwa 15–20 Sätze pro Woche, das ist der obere sinnvolle Bereich. In den ersten 6 Einheiten macht die App je Übung einen Satz weniger. Sinkt deine Kraft zwei Trainings hintereinander oder schläfst du schlecht, lass für eine Woche je einen Satz weg.","Schoenfeld et al. 2017")}
      ${li("Supersätze sparen Zeit.","Zwei kleine Übungen für verschiedene Muskeln machst du direkt hintereinander und pausierst erst danach. Das spart rund 10 Minuten, ohne dass Muskelwachstum verloren geht.","Iversen et al. 2021")}
      ${li("Etwa 10–20 harte Sätze pro Muskel und Woche.","Mehr Sätze bringen mehr Muskel, bis etwa 20. Als Einsteiger reichen 10. Die App zeigt unter Fortschritt, wo du stehst.","Schoenfeld et al. 2017")}
      ${li("Nah ans Muskelversagen.","Stopp 1–2 Wiederholungen vorher. Nur in den ersten 6 Einheiten bewusst 2–3 Wiederholungen Reserve lassen, um die Technik zu lernen.","Robinson et al. 2024")}
      ${li("Ständig steigern – automatisch.","Nach jedem Satz gibst du an, wie viele Wiederholungen noch gegangen wären. Daraus schätzt die App deine aktuelle Kraft und stellt das Gewicht für den nächsten Satz und das nächste Training so ein, dass du in der Ziel-Spanne knapp vor dem Versagen landest. Das ist der wichtigste Wachstumsreiz.","Helms et al. 2016 (RIR-Skala)")}
      ${li("Lange Pausen bei Grundübungen.","2–3 Minuten bei Kniebeuge, Bankdrücken und Co., 90 Sekunden bei kleinen Übungen. Der Timer startet automatisch beim Abhaken.","Schoenfeld et al. 2016")}
      ${li("Voller Bewegungsumfang.","Gerade die gedehnte Position, z. B. tief in der Kniebeuge, regt das Wachstum stark an.","Pedrosa et al. 2022")}
    </ul>
  </section>
  <section class="card stack know">
    <h2>Ernährung</h2>
    <ul>
      ${li("Defizit von 0,5–1 % des Körpergewichts pro Woche.","Langsamer abnehmen schützt die Muskeln. Mit 0,7 % pro Woche bauten Sportler sogar noch Muskeln auf.","Garthe et al. 2011")}
      ${li("Protein 1,6–2,2 g pro kg.","Im Defizit eher am oberen Ende, die App rechnet mit 2 g/kg. Bei deutlichem Übergewicht vom Zielgewicht aus.","Morton et al. 2018")}
      ${li("Auf 3–5 Mahlzeiten verteilen.","Je 30–40 g Protein. Vor dem Schlafen Magerquark oder Skyr, das langsame Eiweiß (Kasein) versorgt nachts die Muskeln.","Snijders et al. 2015")}
      ${li("Echte Daten statt Schätzung.","Formeln liegen oft 10–20 % daneben. Der Wochen-Check rechnet nach 2–3 Wochen aus deinem Essen und Gewichtstrend, was du wirklich verbrauchst.","")}
      ${li("Bauch und Taille:","Bauchmuskeltraining macht die Muskeln kräftiger, aber Fett am Bauch verschwindet nur über das Kaloriendefizit. Gezielt an einer Stelle abnehmen ist nicht möglich. Dein Bauchumfang ist deshalb der wichtigste Messwert.","")}
      ${li("Sattmacher wählen.","Viel Gemüse, Kartoffeln, Haferflocken, mageres Eiweiß. Flüssige Kalorien wie Saft, Limo und Alkohol möglichst weglassen.","")}
    </ul>
  </section>
  <section class="card stack know">
    <h2>Erholung & Alltag</h2>
    <ul>
      ${li("7–9 Stunden Schlaf.","Mit zu wenig Schlaf verloren Teilnehmer im Defizit mehr Muskeln und weniger Fett – bei gleichen Kalorien.","Nedeltcheva et al. 2010")}
      ${li("8.000–10.000 Schritte am Tag.","Alltagsbewegung verbrennt oft mehr als die Ausdauereinheiten und stört den Muskelaufbau nicht.","")}
      ${li("Ausdauer locker halten.","Ruhige Einheiten auf Rad, Laufband oder Crosstrainer stören den Muskelaufbau kaum. Harte Intervalle nicht direkt vor Beintraining.","Wilson et al. 2012")}
    </ul>
  </section>
  <section class="card stack know">
    <h2>Bei hohem Startgewicht</h2>
    <ul>
      ${li("Vorher zum Hausarzt.","Lass Blutdruck, Blutzucker, Blutfette und ein EKG checken, bevor du intensiv trainierst. Ab 35 gibt es den Gesundheits-Check-up alle 3 Jahre auf Kassenkosten.","")}
      ${li("Gelenke schonen.","Maschinen, Kabelzug und Kurzhanteln sind ideal. Kniebeuge zuerst als Goblet Squat auf eine Bank, bis die Technik sitzt. Gehen statt joggen, keine Sprünge.","")}
      ${li("Gerätelimits beachten.","Viele Ausdauergeräte sind nur bis zu einem bestimmten Nutzergewicht zugelassen – das steht auf einem Schild am Gerät.","")}
      ${li("Defizit begrenzt.","Die App plant höchstens 1.000 kcal unter dem Bedarf, das sind etwa 1 kg Fett pro Woche. Größere Defizite gehören in ärztliche Begleitung. In den ersten Wochen fällt die Waage durch Wasserverlust schneller, das ist normal.","")}
      ${li("Ärztliche Möglichkeiten.","Bei sehr hohem Startgewicht gibt es zusätzlich zu Training und Ernährung ärztliche Optionen, etwa Abnehmspritzen mit Semaglutid oder Tirzepatid oder spezielle Adipositas-Programme. Ob das für dich passt und wer die Kosten trägt, klärst du am besten mit deinem Hausarzt.","")}
      ${li("Dein großer Vorteil:","Mit mehr Körperfett und als Einsteiger baust du im Defizit besonders gut Muskeln auf. Kraftwerte steigen anfangs fast jede Woche.","")}
    </ul>
  </section>
  <section class="card stack know">
    <h2>Legale Hilfsmittel · gut belegt</h2>
    <div class="supp"><h3>Kreatin-Monohydrat</h3>
      <p>3–5 g jeden Tag, Uhrzeit egal, eine Ladephase ist unnötig. Es ist das am besten untersuchte Supplement für mehr Kraft und Muskelmasse und kostet etwa 1 € pro Woche. Am Anfang lagerst du 1–2 kg Wasser in den Muskeln ein. Das ist kein Fett, also nicht erschrecken. Bei Nierenerkrankungen vorher den Arzt fragen. <span class="src">ISSN-Position, Kreider et al. 2017</span></p>
      <button class="btn ${cr?"ghost":""} small" data-act="creatine">${cr?"Aus der Checkliste entfernen":"In die tägliche Checkliste aufnehmen"}</button></div>
    <div class="supp"><h3>Koffein</h3>
      <p>Etwa 200 mg (2 Tassen Kaffee) 30–60 Minuten vor dem Training steigern Kraft und Ausdauer. Höchstens 400 mg am Tag und nach etwa 14 Uhr keins mehr, sonst leidet der Schlaf. Bei Bluthochdruck oder Herzproblemen vorher den Arzt fragen und den Blutdruck beim Check-up messen lassen. <span class="src">EFSA 2015 · ISSN 2021</span></p></div>
    <div class="supp"><h3>Proteinpulver</h3>
      <p>Whey oder Mehrkomponenten-Protein ist kein Wundermittel, aber praktisch, wenn du dein Proteinziel mit Essen nicht schaffst. Ein Shake mit 30 g Pulver liefert etwa 24 g Protein.</p></div>
  </section>
  <section class="card stack know">
    <h2>Nur bei Bedarf</h2>
    <ul>
      ${li("Vitamin D:","Im Winter haben viele in Deutschland zu wenig. Am besten erst beim Hausarzt messen lassen und dann gezielt ergänzen.","")}
      ${li("Omega-3:","Sinnvoll, wenn du selten fetten Fisch isst. Für den Muskelaufbau sind die Belege schwach.","")}
    </ul>
  </section>
  <section class="card stack know">
    <h2>Spar dir das Geld</h2>
    <p>BCAA oder EAA, Testo-Booster, Fatburner, L-Carnitin, Glutamin und teure Pre-Workout-Mischungen bringen kaum etwas. In den Mischungen wirkt meist nur das Koffein. Wenn du genug Protein isst, haben Aminosäure-Pulver keinen Zusatznutzen.</p>
  </section>
  <section class="card stack know warnbox">
    <h2>Finger weg</h2>
    <p>SARMs, Prohormone, Clenbuterol, DNP und sogenannte „Research Chemicals“ sind nicht zugelassen und teils illegal. Sie greifen ins Hormonsystem ein und können Leber und Herz schädigen. DNP kann sogar tödlich sein. Auch legale Supplemente sind manchmal verunreinigt. Produkte mit dem Siegel der <b>Kölner Liste</b> sind darauf getestet.</p>
  </section>
  <section class="card stack know">
    <h2>Ausrüstung, die wirklich hilft</h2>
    <ul>
      ${li("Küchenwaage (ca. 10 €):","Der größte Hebel für genaues Kalorienzählen. Schätzen liegt oft 20–30 % daneben.","")}
      ${li("Körperwaage und Maßband:","Morgens nüchtern wiegen, die App bildet den Durchschnitt. Den Bauchumfang 1× pro Woche messen.","")}
      ${li("Schrittzähler:","Das Handy oder eine Uhr reicht.","")}
      ${li("Zughilfen (Straps):","Erst später, wenn beim Kreuzheben oder Rudern der Griff vor dem Rücken aufgibt. Gürtel und Handschuhe brauchst du als Einsteiger nicht.","")}
    </ul>
    <p class="sub">Bei Vorerkrankungen oder wenn du Medikamente nimmst, besprich Supplemente und Defizit kurz mit deinem Hausarzt.</p>
  </section>`;
}

// ---------- Events ----------
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.tab=b.dataset.tab;lsSet("formkurve-tab",S.tab);render();window.scrollTo(0,0)});
$("#prev").onclick=()=>{S.sel=addDays(S.sel,-1);render()};
$("#next").onclick=()=>{if(S.sel<today()){S.sel=addDays(S.sel,1);render()}};
$("#view").addEventListener("submit",e=>{
  if(e.target.id!=="food-form")return;e.preventDefault();
  const n=$("#f-name").value.trim(),k=num($("#f-kcal").value),p=num($("#f-p").value);
  if(!n||k==null){flash("Bitte Name und kcal eintragen");return}
  addFood({n,kcal:k,p:p||0});
});
$("#view").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=b.dataset.v,mk="log-"+S.sel.slice(0,7);
  if(a==="tab"){S.tab=v;render();window.scrollTo(0,0)}
  else if(a==="start"){S.trainPlan=v;S.tab="train";render();window.scrollTo(0,0)}
  else if(a==="check"){const d=dayObj(S.sel,true);d.checks=d.checks||{};d.checks[v]=!d.checks[v];touch(mk);b.setAttribute("aria-pressed",d.checks[v])}
  else if(a==="weight"){const w=num($("#w-in").value);if(w==null||w<30||w>300){flash("Gewicht in kg eingeben, z. B. 84,2");return}
    dayObj(S.sel,true).weight=w;const st=S.docs.settings||(S.docs.settings={});if(!st.startW){st.startW=w;touch("settings")}touch(mk);render();flash("Gewicht gespeichert")}
  else if(a==="steps"){const n=num(String($("#steps-in").value).replace(/\./g,""));if(n==null||n<0||n>100000){flash("Schritte als Zahl eintragen");return}
    const d=dayObj(S.sel,true);d.steps=Math.round(n);d.checks=d.checks||{};d.checks.steps=n>=stepGoal();touch(mk);render();flash(n>=stepGoal()?"Schrittziel geschafft":"Schritte gespeichert")}
  else if(a==="stepgoal"){const st=S.docs.settings||(S.docs.settings={});st.stepGoal=+v;touch("settings");render()}
  else if(a==="waist"){const w=num($("#waist-in").value);if(w==null||w<40||w>250){flash("Umfang in cm eingeben");return}dayObj(S.sel,true).waist=w;touch(mk);render();flash("Bauchumfang gespeichert")}
  else if(a==="plan"){S.trainPlan=v;S.swapOpen=null;render()}
  else if(a==="swap-open"){S.swapOpen=S.swapOpen===v?null:v;render()}
  else if(a==="swap"){const [key,id]=v.split("|");const st=S.docs.settings||(S.docs.settings={});st.swaps=st.swaps||{};
    const def=PLAN[key[0]].slots[+key.split("-")[1]].def;if(id===def)delete st.swaps[key];else st.swaps[key]=id;
    touch("settings");S.swapOpen=null;render();flash(LIB[id].n.replace(/ \(.*\)/,"")+" eingeplant")}
  else if(a==="tick"){const art=b.closest(".ex"),row=b.closest(".set"),ex=resolve(S.trainPlan).find(x=>x.id===art.dataset.ex);const st=drafts[S.trainPlan].sets[ex.id][+row.dataset.i];
    st.done=!st.done;if(st.done&&!st.reps){const s=suggest(ex);st.reps=String(ex.time?(s.target||ex.lo):ex.lo);row.querySelector('[data-f="reps"]').value=st.reps}
    if(!st.done)delete st.rir;
    saveDrafts();row.classList.toggle("done",st.done);b.setAttribute("aria-pressed",st.done);
    const rr=art.querySelector(`.rir[data-i="${row.dataset.i}"]`);if(rr){rr.hidden=!st.done;rr.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"))}
    if(st.done){const adv=applyAdvice(art,ex,+row.dataset.i);const nx=ex.ssNext&&resolve(S.trainPlan).find(x=>x.key===ex.ssNext);
      startRest(restFor(ex),nx?"Supersatz: direkt weiter zu "+nx.n.replace(/ \(.*\)/,""):adv&&adv.d!==0?adv.why.split(" – ")[0]:ex.n.replace(/ \(.*\)/,"")+" · Satz "+(+row.dataset.i+1)+" geschafft")}}
  else if(a==="rir"){const art=b.closest(".ex"),ex=resolve(S.trainPlan).find(x=>x.id===art.dataset.ex);const [i,r]=v.split("|").map(Number);
    const st=drafts[S.trainPlan].sets[ex.id][i];st.rir=r;b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
    const adv=applyAdvice(art,ex,i);if(adv&&T.end&&adv.d!==0){T.label=adv.why.split(" – ")[0];if(T.iv)$("#rest-label").textContent=T.label}}
  else if(a==="save-session")saveSession();
  else if(a==="save-cardio")saveCardio();
  else if(a==="tempo"){const st=S.docs.settings||(S.docs.settings={});st.tempo=+v;S.estRes=null;touch("settings");render();flash("Tempo: "+fmt(+v,1)+" % pro Woche")}
  else if(a==="apply-adaptive"){const st=S.docs.settings||(S.docs.settings={});st.kcal=+v;touch("settings");render();flash("Kalorienziel: "+fmt(+v)+" kcal")}
  else if(a==="creatine"){const st=S.docs.settings||(S.docs.settings={});st.creatine=!st.creatine;touch("settings");render();flash(st.creatine?"Kreatin steht jetzt in deiner Checkliste":"Kreatin aus der Checkliste entfernt")}
  else if(a==="export")exportBackup();
  else if(a==="import"){const fi=$("#import-in");fi.value="";fi.click()}
  else if(a==="cdev"){S.cdev=v;render()}
  else if(a==="ctype"){S.ctype=v;render()}
  else if(a==="photo"){photoTarget=v;const fi=$("#photo-in");fi.value="";fi.click()}
  else if(a==="del-session"){const t=+v;if(S.confirmDel!==t){S.confirmDel=t;render();setTimeout(()=>{if(S.confirmDel===t){S.confirmDel=null;if(S.tab==="train")safeRender()}},4000);return}
    S.confirmDel=null;Object.keys(S.docs).filter(k=>k.startsWith("wo-")).forEach(k=>{const before=(S.docs[k].sessions||[]).length;S.docs[k].sessions=(S.docs[k].sessions||[]).filter(s=>s.t!==t);if(S.docs[k].sessions.length!==before)touch(k)});render();flash("Einheit gelöscht")}
  else if(a==="preset"){const f=presetList[+v];if(f)addFood(f)}
  else if(a==="del-food"){const d=dayObj(S.sel,true);(d.food||[]).splice(+v,1);touch(mk);render()}
  else if(a==="save-settings"){const st=S.docs.settings||(S.docs.settings={});
    const k=num($("#s-kcal").value),p=num($("#s-p").value),sw=num($("#s-start").value),tw=num($("#s-target").value);
    if(k!=null&&(k<1200||k>5000)){flash("Kalorienziel zwischen 1.200 und 5.000 wählen");return}
    st.kcal=k||null;st.protein=p||null;st.startW=sw||null;st.targetW=tw||null;touch("settings");render();flash("Ziele gespeichert")}
  else if(a==="estimate"){const sex=$("#e-sex").value,age=num($("#e-age").value),h=num($("#e-h").value),w=num($("#e-w").value),act=$("#e-act").value;
    S.est={sex,age:$("#e-age").value,h:$("#e-h").value,w:$("#e-w").value,act};
    if(!age||!h||!w){flash("Alter, Größe und Gewicht eintragen");render();return}
    const bmr=10*w+6.25*h-5*age+(sex==="m"?5:-161),tdee=bmr*num(act),def=deficitFor(w);
    S.estRes={sex,tdee:Math.round(tdee/10)*10,def:Math.round(def/10)*10,kcal:Math.max(sex==="m"?1500:1200,Math.round(bmr/50)*50,Math.round((tdee-def)/50)*50),p:proteinFor(w,h),age,h};render()}
  else if(a==="apply-est"){const st=S.docs.settings||(S.docs.settings={});st.kcal=S.estRes.kcal;st.protein=S.estRes.p;st.sex=S.estRes.sex;st.age=S.estRes.age;st.h=S.estRes.h;touch("settings");S.estRes=null;render();flash("Ziele übernommen")}
});

$("#rest-add").onclick=()=>{T.end=Math.max(T.end,Date.now())+30000;if(!T.iv){T.iv=setInterval(tickRest,250);$("#rest").classList.remove("over");$("#rest-label").textContent=T.label}tickRest()};
$("#rest-stop").onclick=()=>stopRest(false);
(function migratePlan(){const st=S.docs.settings||{};if((st.planV||1)<PLAN_V){if(st.swaps)st.swaps={};drafts={};saveDrafts();S.docs.settings=Object.assign(st,{planV:PLAN_V});touch("settings")}})();
$("#import-in").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)importBackup(f)});
$("#photo-in").addEventListener("change",e=>onPhoto(e.target.files&&e.target.files[0]));
render();
connect();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
